          historical_conversion_rate: 0.045    # 4.5% baseline
          expected_treatment_rate: 0.0675      # 6.75% (50% relative improvement)
          daily_eligible_sessions: null
      
      secondary:
        - name: "average_order_value"
          definition: "total_revenue / total_orders"
          guardrail_threshold: -0.15            # Accept 15% AOV decrease
          calculation_window: "30_days_post_assignment"
          expected_direction: "decrease"
          
        - name: "revenue_per_session"
          definition: "total_revenue / unique_sessions_with_cart_above_min"
          target_direction: "increase"          # Primary business goal
          calculation_window: "30_days_post_assignment"
          
        - name: "customer_lifetime_value"
          definition: "total_customer_value_90_days / unique_customers"
          target_direction: "increase"
          calculation_window: "90_days_post_assignment"
      
      guardrail_metrics:
        - name: "refund_rate"
          definition: "refunded_orders / total_orders"
          threshold: 0.05
          monitoring_frequency: "daily"
          alert_condition: "above_threshold"
          
        - name: "customer_service_volume"
          definition: "support_tickets / total_orders"
          threshold: 1.3
          monitoring_frequency: "daily"
          alert_condition: "above_baseline_ratio"
    
    # === STATISTICAL POWER ANALYSIS ===
    power_analysis:
      
      # Maintain statistical rigor
      statistical_power: 0.70                  # 70% power (industry standard)
      significance_level: 0.10                 # 10% Type I error (90% confidence)
      test_type: "two_sided"                   # Conservative approach
      multiple_testing_correction: "bonferroni" # Account for secondary metrics
      
      # Realistic effect size for feasibility
      effect_size:
        type: "relative_improvement"
        magnitude: 0.50                       # 50% relative change (realistic for shipping)
        baseline_metric_value: 0.045          # 4.5% current conversion rate
        treatment_metric_value: 0.0675        # 6.75% expected treatment rate
        absolute_difference: 0.0225           # 2.25 percentage points absolute
        minimum_detectable_effect: 0.50       # Large but realistic minimum effect
      
      sample_size:
        required_per_variant: null
        total_required: null
        safety_buffer: 1.10                  # 10% buffer for data quality
        final_target_per_variant: null
      
      traffic_analysis:
        daily_total_users: null
        daily_eligible_users: null
        eligible_user_percentage: null
        daily_users_per_variant: null
        traffic_variability: null
      
      duration_calculation:
        required_duration_days: null
        business_minimum_days: 14             # Maintain business requirements
        business_maximum_days: 42             # Extended but realistic maximum
        final_planned_duration: null
        feasibility_status: null
        
      sequential_testing:
        enable_early_stopping: true          # Enable for efficiency
        interim_analysis_frequency: 7        # Weekly reviews
        alpha_spending_function: "obrien_fleming"
        futility_boundary: 0.10              # Conservative futility stopping
        superiority_boundary: 0.001          # Early success criteria
    
    # === IMPLEMENTATION REQUIREMENTS ===
    implementation:
      data_generation:
        base_data_source: "bigquery-public-data.thelook_ecommerce"
        synthetic_overlay_tables:
          - "experiment_assignments"
          - "experiment_outcomes"
          - "experiment_metadata"
        
        effect_modeling:
          baseline_conversion_rate: 0.045     # Realistic baseline
          treatment_effect_size: 0.50         # Large realistic effect
          effect_emergence_timeline: 7        # One week for full effect
          individual_variation: 0.12          # Realistic variation
          temporal_patterns: true             # Include day-of-week effects
      
      analysis_requirements:
        primary_analysis_method: "two_proportion_z_test"
        confidence_interval_method: "wilson_score"  # Robust for proportions
        subgroup_analysis: ["customer_segment", "device_type", "geographic_region"]
        heterogeneous_treatment_effects: true
        bootstrap_iterations: 1000           # Robust confidence intervals
        
      decision_framework:
        launch_criteria:
          statistical_significance: true      # p < 0.10
          practical_significance: true       # Effect size ≥ 50%
          guardrail_compliance: true         # All guardrails within limits
          business_case_positive: true       # Positive ROI required
          
        stop_criteria:
          guardrail_violation: true          # Safety first
          futility_reached: true             # Early stopping for futility
          maximum_duration_reached: true     # Time constraint
          business_priorities_changed: true  # Strategic flexibility
    
